server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  app.html app.htm;
        try_files $uri $uri/ /app.html;
    }

    # Custom Error Pages mapping configurations
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
